name: Aggiorna feed Overture
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'feed/build_feed.py'
      - 'feed/requirements.txt'
      - '.github/workflows/publish-overture.yml'
  schedule:
    - cron: '19 7 3 * *'
permissions:
  contents: write
concurrency:
  group: overture-feed
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r feed/requirements.txt
      - run: python feed/build_feed.py
      - name: Pubblica i due file JSON
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add feed/public/milano.json feed/public/monza.json feed/public/index.html
          if ! git diff --cached --quiet; then
            git commit -m 'Aggiorna strutture Overture'
            git push
          fi
